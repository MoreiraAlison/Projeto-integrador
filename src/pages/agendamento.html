<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Agendamento</title>

    <link rel="stylesheet" href="agendamento.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header class="topbar">
    <div class="logo-area">
        <img src="file:///C:/Users/21620230039/OneDrive%20-%20MARISTA%20BRASIL/Imagens/Capturas%20de%20tela/Captura%20de%20tela%202026-02-23%20083349.png" alt="Logo">
    </div>

    <h1>Marista Escola Social Cascavel</h1>

    <div class="user-area">
        <i class="fa-solid fa-bell"></i>

        <div class="user-info">
            <span class="name" id="nomeUsuario"></span>
            <span class="role" id="tipoUsuario"></span>
        </div>

        <i class="fa-solid fa-arrow-right-from-bracket logout" title="Sair"></i>
    </div>
</header>

<main class="container">

    <!-- LINK VOLTAR ABAIXO DA LOGO -->
    <div class="voltar-container">
        <a href="inicio.html" class="voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar para o início
        </a>
    </div>

    <!-- CARD DE AGENDAMENTO -->
    <div class="card">
        <h2>Criar Novo Atendimento</h2>
        <p class="subtitle">Preencha as informações abaixo para agendar sua reunião</p>

        <!-- PROFISSIONAL -->
        <label>Selecione o profissional</label>
        <select>
            <option>Selecione o profissional</option>
            <option>Prof. Louize - Arte/Web Design</option>
            <option>Ivan - Coordenador</option>
            <option>Eduardo - Diretor</option>
            <option>Flávia - Assistente Social</option>
        </select>

        <!-- LINHA COM DATA E HORÁRIO -->
        <div class="linha">
            <div class="campo">
                <label>Escolha a data</label>
                <input type="date">
            </div>

            <div class="campo">
                <label>Escolha o horário</label>
                <input type="time">
            </div>
        </div>

        <!-- CAMPO MOTIVO ABAIXO -->
        <div class="campo motivo">
            <label>Motivo do agendamento</label>
            <textarea placeholder="Ex: conversar sobre minhas notas..."></textarea>
        </div>

        <!-- BOTÕES -->
        <div class="botoes">
            <button class="cancelar" onclick="voltar()">Cancelar</button>
            <button class="confirmar" onclick="confirmar()">Confirmar</button>
        </div>
    </div>

</main>

<script>
const dados = JSON.parse(localStorage.getItem("usuario"));

const nome = document.getElementById("nomeUsuario");
const tipo = document.getElementById("tipoUsuario");

if (dados) {
    nome.textContent = dados.nome;
    if (dados.tipo === "aluno") tipo.textContent = "Aluno";
    else if (dados.tipo === "profissional") tipo.textContent = dados.cargo;
    else tipo.textContent = "Responsável";
}

// LOGOUT
document.querySelector(".logout").addEventListener("click", () => {
    if (confirm("Deseja sair da conta?")) {
        localStorage.removeItem("usuario");
        window.location.href = "login.html";
    }
});

// SINO
document.querySelector(".fa-bell").addEventListener("click", () => {
    alert("Notificações");
});

function voltar() {
    window.location.href = "inicio.html";
}

function confirmar() {
   window.location.href = "solicitacao.html";
}
</script>

</body>
</html>
